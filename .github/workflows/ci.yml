name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: fmt
            command: cargo fmt --all -- --check
          # --workspace: the aerocapture-py crate (the one seam between the two languages) is
          # linted and unit-tested too; the root is itself a package, so without the flag cargo
          # scopes both commands to it alone.
          - check: clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          - check: test
            command: cargo test --release --workspace

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: ${{ matrix.check }}
        run: ${{ matrix.command }}

  python-lint:
    name: Python (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: uv run ruff check src/python tests experiments
          - check: format
            command: uv run ruff format --check src/python tests experiments
          - check: typecheck
            command: uv run mypy src/python tests experiments

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: ${{ matrix.check }}
        run: ${{ matrix.command }}

  # ONE test job with the CLI binary AND the extension built: every file under tests/ runs here,
  # nothing is allowlisted by name. Coverage follows the file tree. The soft-import contract
  # (modules that must import without the extension) is a named test, tests/test_soft_import.py,
  # not a separate extension-less job.
  python-test:
    name: Python (test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: Build Rust simulator (CLI, used by the subprocess bit-identity gate)
        run: cargo build --release
        working-directory: src/rust

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build PyO3 module into the synced venv
        run: uv run maturin develop --release --manifest-path src/rust/aerocapture-py/Cargo.toml

      - name: Run every test (fast + slow), no skips for a missing extension
        # GitHub's default shell runs with pipefail, so a pytest failure still fails the step through the tee.
        run: |
          uv run pytest tests -q -rs | tee pytest.log
          if grep -q "could not import 'aerocapture_rs'" pytest.log; then
            echo "::error::a test skipped because aerocapture_rs was missing: the extension build did not reach pytest"
            exit 1
          fi
