name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: fmt
            command: cargo fmt --all -- --check
          # --workspace: the aerocapture-py crate (the one seam between the two languages) is
          # linted and unit-tested too; the root is itself a package, so without the flag cargo
          # scopes both commands to it alone.
          - check: clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          - check: test
            command: cargo test --release --workspace

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: ${{ matrix.check }}
        run: ${{ matrix.command }}

  python-lint:
    name: Python (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: uv run ruff check src/python tests experiments articles/paper/scripts
          - check: format
            command: uv run ruff format --check src/python tests experiments articles/paper/scripts
          - check: typecheck
            command: uv run mypy src/python tests experiments

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: ${{ matrix.check }}
        run: ${{ matrix.command }}

  # One test job with the CLI binary and the extension built; every file under tests/ runs here.
  python-test:
    name: Python (test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: Build Rust simulator (CLI, used by the subprocess bit-identity gate)
        run: cargo build --release
        working-directory: src/rust

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build PyO3 module into the synced venv
        run: uv run maturin develop --release --manifest-path src/rust/aerocapture-py/Cargo.toml

      - name: Prove the extension reached the venv (so no importorskip can silently skip)
        run: uv run python -c "import aerocapture_rs; print(aerocapture_rs.__file__)"

      - name: Run every test (fast + slow)
        run: uv run pytest tests -q -rs

  # The paper's figures rebuild from the committed bundle alone: no Rust, no simulator,
  # no run logs. Every fig_*.svg is regenerated and must be byte-identical to git;
  # then the bundle checksums + results.json schema, and the PDF compiles (to /tmp:
  # the committed PDF is hand-recompiled, never a CI artifact).
  paper:
    name: Paper (figures + pdf)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      - name: Regenerate every figure
        run: make -C articles/paper -B figures

      - name: TEMP probe (per-artist bboxes of fig_ablation; remove before merge)
        run: |
          uv run python - <<'PY'
          import sys, json
          sys.path.insert(0, "articles/paper/scripts")
          import matplotlib as mpl
          mpl.use("Agg")
          import matplotlib.pyplot as plt
          import matplotlib.ft2font as ft
          import figlib as fl
          fl.style()
          print("freetype", ft.__freetype_version__, "mpl", mpl.__version__)
          a = json.loads((fl.RUNS / "headline/mamba_p962/ablation_results.json").read_text())
          ranked = [x for x in a["ranked"] if not x.get("masked_out") and x["delta"] > 0][:12][::-1]
          names = [x["name"] for x in ranked]; deltas = [x["delta"] for x in ranked]
          fig, ax = plt.subplots(figsize=fl.SIZE1)
          ax.barh(range(len(names)), deltas, color=fl.C["mamba"], alpha=0.85)
          ax.set_yticks(range(len(names))); ax.set_yticklabels(names, fontsize=8.5)
          ax.set_xlabel("cost increase when input zeroed (log-transform units)")
          ax.set_title("Mamba-962 input importance (top 12)", fontsize=10, loc="left")
          for i, d in enumerate(deltas):
              ax.annotate(f"{d:.2f}", (d, i), textcoords="offset points", xytext=(3, 0), va="center", fontsize=7.5)
          ax.margins(x=0.12)
          fig.tight_layout()
          r = fig.canvas.get_renderer()
          print("fig tightbbox", fig.get_tightbbox(r).bounds)
          print("axes tightbbox", ax.get_tightbbox(r).bounds)
          print("axes position", ax.get_position().bounds)
          for art in ax.get_children():
              try:
                  bb = art.get_tightbbox(r) if hasattr(art, "get_tightbbox") else art.get_window_extent(r)
              except Exception:
                  bb = None
              if bb is not None and bb.width > 0:
                  print(type(art).__name__, getattr(art, "get_text", lambda: "")()[:30], [round(v, 6) for v in bb.bounds])
          for t in ax.get_xticklabels() + ax.get_yticklabels():
              print("tick", t.get_text()[:20], [round(v, 6) for v in t.get_window_extent(r).bounds])
          PY

      # Always uploaded: when `check` fails, download this and diff it against git locally.
      - name: Upload the regenerated figures
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures-${{ runner.os }}
          path: articles/paper/figures/fig_*.svg

      - name: Figures unchanged, bundle checksums, results.json schema
        run: make -C articles/paper check

      - name: Compile the paper
        run: make -C articles/paper pdf PDF=/tmp/paper.pdf

  # results.json needs the 195 MB run-log Release asset: manual trigger only.
  paper-results:
    name: Paper (results.json from the run logs)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Fetch the run logs (Release asset arxiv-v2) and verify them
        run: make -C articles/paper fetch-logs check-logs

      - name: Rebuild results.json and require it unchanged
        run: |
          make -C articles/paper results
          git diff --exit-code --stat -- articles/paper/data/results.json
