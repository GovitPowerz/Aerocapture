# OU-marginal retrain: gru_p1014 from scratch under per-draw noise seeding.
# Sweep-config allocation (GA n_pop 60, training_n_sims 10, adaptive seeds), NOT the
# headline's CLI allocation (n_pop 512, training_n_sims 2, see 10b_arch_long_challengers.sh); budget
# target 20000 gens = the deployed cell's budget (driven by the campaign runner).
base = ["../sweep/gru_p1014.toml"]

[monte_carlo]
noise_seeding = "per_draw"

[data]
neural_network = "training_output/ou_marginal/gru_p1014/best_model.json"

[checkpoints]
keep_last = 3
