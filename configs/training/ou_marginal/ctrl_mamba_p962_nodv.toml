# No-predicted-DV control on the v4 champion (#176): the champion's Mamba architecture with the three
# predicted correction-DV inputs (candidate indices 32/33/34) removed from the mask (914 weights),
# trained from scratch under per-draw noise seeding at the champion's allocation and budget (GA
# 512 x 2, 20000 gens; adaptive seeds and the cubed transform come from the family config). Driven
# by experiments/ou_marginal/campaign.sh experiments/ou_marginal/jobs_controls.txt; decision rule in
# experiments/paper/15_state_controls.sh.
base = ["../paper/mamba_p962_nodv.toml"]

[monte_carlo]
noise_seeding = "per_draw"

[optimizer]
n_pop = 512
training_n_sims = 2

[data]
neural_network = "training_output/ou_marginal/ctrl_mamba_p962_nodv/best_model.json"

[checkpoints]
keep_last = 3
