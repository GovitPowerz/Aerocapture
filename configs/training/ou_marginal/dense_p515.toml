# OU-marginal retrain: dense_p515 from scratch under per-draw noise seeding.
# Same cell regime (GA n_pop 60, adaptive seeds, training_n_sims 10); budget
# target 20000 gens = the deployed cell's budget (driven by the campaign runner).
base = ["../paper/dense_p515_ga.toml"]

[monte_carlo]
noise_seeding = "per_draw"

[data]
neural_network = "training_output/ou_marginal/dense_p515/best_model.json"

[checkpoints]
keep_last = 3
