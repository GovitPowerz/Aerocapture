# Headline allocation (#173): lstm_p1082 trained from scratch under per-draw noise seeding at
# the paper's recommended allocation (GA n_pop 512, training_n_sims 2; adaptive seeds and
# cubed transform come from the family config). The allocation is stated here because a
# config that base-inherits this one does not inherit CLI flags. Target 20000 gens, driven by
# experiments/ou_marginal/campaign.sh experiments/ou_marginal/jobs_headline.txt.
base = ["../sweep/lstm_p1082.toml"]

[monte_carlo]
noise_seeding = "per_draw"

[optimizer]
n_pop = 512
training_n_sims = 2

[data]
neural_network = "training_output/ou_marginal/hl_lstm_p1082/best_model.json"

[checkpoints]
keep_last = 3
