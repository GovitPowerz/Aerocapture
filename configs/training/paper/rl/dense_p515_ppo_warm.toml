# Paper Section 5 RL baseline -- dense PPO warm-started from the per-scenario dense
# champion it is compared to (the population optimum). Everything but the deploy path
# inherits from dense_p515_ppo_scratch.toml.
#
#   uv run python -m aerocapture.training.rl.train configs/training/paper/rl/dense_p515_ppo_warm.toml \
#       --data-neural-network training_output/ou_marginal/ft_dense_p515/best_model.json --no-tui
base = ["dense_p515_ppo_scratch.toml"]

[data]
neural_network = "training_output/paper/rl/dense_p515_ppo_warm/best_model.json"
results_suffix = ".paper_rl_dense_p515_ppo_warm"
