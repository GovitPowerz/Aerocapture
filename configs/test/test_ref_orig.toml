# Test: reference trajectory, constant bank angle 0.1 deg
# Reference data: tests/reference_data/rust_golden/ref/
base = ["../missions/mars.toml"]

[guidance]
type = "ftc"
reference_trajectory = true
reference_bank_angle = 0.1

[simulation]
n_sims = 1
random_seed = 0.6866

[data]
results_suffix = ".test_ref_orig"

[onboard_atmosphere]
mode = "identical"

[monte_carlo]
seed = 42
noise_seeding = "legacy"  # no dispersion domains: undispersed run; the pin states the regime its reference output was frozen under
