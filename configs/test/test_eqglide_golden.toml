# Golden regression test — EquilibriumGlide, 3 MC sims, deterministic seed
base = ["../missions/mars.toml"]

[guidance]
type = "equilibrium_glide"

[simulation]
n_sims = 3
random_seed = 0.6866

[data]
results_suffix = ".golden_eqglide"

[onboard_atmosphere]
mode = "identical"

[monte_carlo]
noise_seeding = "legacy"  # goldens were frozen under the pre-ADR-0006 shared noise path (no OU / bias nav here, so regime-neutral; pinned to state it)
seed = 42

[monte_carlo.initial_state]
level = "medium"

[monte_carlo.atmosphere]
level = "high"

[monte_carlo.aerodynamics]
level = "medium"

[monte_carlo.navigation]
level = "low"

[monte_carlo.mass]
level = "off"
